[project]
name = "obsidian-slim-mcp"
version = "0.1.0"
description = "Obsidian vault operations via Local REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
obsidian-slim-mcp = "obsidian_slim_mcp:main"
obsidian-cli = "obsidian_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
]
